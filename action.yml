name: 'toolcall-linter'
description: 'Lint agent transcript tool calls against declared schemas.'
author: 'Victor'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  transcript:
    description: 'Path to transcript(s). Glob patterns are supported.'
    required: true
  tools:
    description: 'Path to tools.json or MCP source (e.g. mcp-stdio:<cmd> or mcp-http:<url>).'
    required: true
  format:
    description: 'Output format: text, json, or sarif.'
    required: false
    default: 'sarif'
  fail-on-blockers:
    description: 'Fail the step when any finding is reported.'
    required: false
    default: 'true'

outputs:
  findings-count:
    description: 'Number of findings reported.'
  report-path:
    description: 'Path to the generated report file.'

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.transcript }}" ]; then
          echo "error: input 'transcript' is required." >&2
          exit 2
        fi
        if [ -z "${{ inputs.tools }}" ]; then
          echo "error: input 'tools' is required." >&2
          exit 2
        fi
        case "${{ inputs.format }}" in
          text|json|sarif) ;;
          *)
            echo "error: format must be one of text, json, or sarif." >&2
            exit 2
            ;;
        esac

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install toolcall-linter
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ github.workspace }}"

    - name: Run toolcall-linter
      id: lint
      shell: bash
      run: |
        FORMAT="${{ inputs.format }}"
        case "$FORMAT" in
          sarif) EXT=sarif ;;
          json)  EXT=json ;;
          text)  EXT=txt ;;
        esac
        REPORT="${{ github.workspace }}/toolcall-linter-report.${EXT}"
        echo "report-path=${REPORT}" >> "$GITHUB_OUTPUT"

        # Expand globs safely with bash.
        set +f
        TRANSCRIPTS=( ${{ inputs.transcript }} )
        set -f

        if [ ${#TRANSCRIPTS[@]} -eq 0 ]; then
          echo "error: no transcript files matched '${{ inputs.transcript }}'." >&2
          exit 2
        fi

        toolcall-linter "${TRANSCRIPTS[@]}" \
          --tools "${{ inputs.tools }}" \
          --format "$FORMAT" > "$REPORT"
        EXIT_CODE=$?
        echo "toolcall-linter exited with code ${EXIT_CODE}"

        # Count findings from the report.
        COUNT=0
        if [ "$FORMAT" = "json" ]; then
          COUNT=$(python -c "import sys,json; d=json.load(open(sys.argv[1])); print(d.get('violation_count', len(d.get('violations', []))))" "$REPORT")
        elif [ "$FORMAT" = "sarif" ]; then
          COUNT=$(python -c "import sys,json; d=json.load(open(sys.argv[1])); print(len(d.get('runs',[{}])[0].get('results',[])))" "$REPORT")
        else
          # Text: one non-empty line per finding.
          COUNT=$(grep -c . "$REPORT" || true)
        fi
        echo "findings-count=${COUNT}" >> "$GITHUB_OUTPUT"
        echo "Findings: ${COUNT}"

        if [ "${{ inputs.fail-on-blockers }}" = "true" ] && [ "$COUNT" -gt 0 ]; then
          exit 1
        fi
        # If the tool errored with a usage/config problem (exit 2), propagate it.
        # Otherwise (exit 0 or exit 1 for findings) we have already handled the
        # failure decision above, so return 0.
        if [ "$EXIT_CODE" -eq 2 ]; then
          exit 2
        fi
        exit 0
